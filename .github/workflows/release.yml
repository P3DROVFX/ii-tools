# A release for every new version, with no hands on it: bump versionName (and versionCode) in
# app/build.gradle.kts, write .github/releases/<version>.md, push to master. This builds the
# signed APK, draws the banner, tags v<version> and publishes the release with both.
#
# A push whose version already has its tag does nothing, so ordinary commits pass through.
# Secrets: II_KEYSTORE_BASE64 (the release keystore, base64), II_KEYSTORE_PASSWORD,
# II_KEY_ALIAS, II_KEY_PASSWORD. Without them, or with an APK signed by any other key, it
# stops before publishing: a release under another key could not update installed apps.
name: Release

on:
  push:
    branches: [master]
    paths:
      - app/build.gradle.kts
      - .github/releases/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The release key's certificate (README, "Install"): every release must carry it.
  CERT_SHA256: 9a1c024a4131dd667f6c72fd959947bfaa251dc97f1fe53c7cf18ecc94b374f1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Version
        id: v
        run: |
          version=$(sed -nE 's/^\s*versionName\s*=\s*"([^"]+)".*/\1/p' app/build.gradle.kts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released: nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -f ".github/releases/$version.md" ]]; then
            echo "::error::versionName is $version but .github/releases/$version.md is missing"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Signing key
        if: steps.v.outputs.skip == 'false'
        env:
          KEYSTORE: ${{ secrets.II_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE" ]]; then
            echo "::error::the II_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - uses: actions/setup-java@v5
        if: steps.v.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: 21

      # The runner's own SDK (ANDROID_HOME): its sdkmanager takes the licences, and AGP fetches
      # the platform and build tools it needs.
      - name: Android SDK
        if: steps.v.outputs.skip == 'false'
        run: |
          echo "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v5
        if: steps.v.outputs.skip == 'false'

      - name: Build the APK
        if: steps.v.outputs.skip == 'false'
        env:
          II_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          II_KEYSTORE_PASSWORD: ${{ secrets.II_KEYSTORE_PASSWORD }}
          II_KEY_ALIAS: ${{ secrets.II_KEY_ALIAS }}
          II_KEY_PASSWORD: ${{ secrets.II_KEY_PASSWORD }}
        run: |
          yes | sdkmanager --licenses > /dev/null
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "ii-tools-${{ steps.v.outputs.version }}.apk"

      - name: Check the signature
        if: steps.v.outputs.skip == 'false'
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          got=$("$apksigner" verify --print-certs "ii-tools-${{ steps.v.outputs.version }}.apk" 2>/dev/null \
            | sed -nE 's/^Signer #1 certificate SHA-256 digest: ([0-9a-f]+)$/\1/p')
          if [[ "$got" != "$CERT_SHA256" ]]; then
            echo "::error::the APK is signed by $got, not the release key ($CERT_SHA256)"
            exit 1
          fi

      - uses: actions/setup-python@v6
        if: steps.v.outputs.skip == 'false'
        with:
          python-version: "3.12"

      - name: Draw the banner
        if: steps.v.outputs.skip == 'false'
        run: |
          pip install --quiet numpy pillow
          python3 tools/make-release-banner.py --out "ii-tools-${{ steps.v.outputs.version }}-banner.png"

      - name: Publish
        if: steps.v.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          repo="${{ github.repository }}"
          # The fingerprint as the README prints it: upper case, colon separated.
          cert=$(echo "$CERT_SHA256" | tr a-f A-F | sed 's/../&:/g; s/:$//')
          {
            echo "![ii tools $V](https://github.com/$repo/releases/download/v$V/ii-tools-$V-banner.png)"
            echo
            # The notes: everything below the first '---' (above it is the banner's).
            sed '1,/^---/d' ".github/releases/$V.md"
            echo
            echo "**Install:** download \`ii-tools-$V.apk\` below and follow the [install steps](https://github.com/$repo#install). It updates earlier releases in place, and from 1.4.0 on the app offers new ones itself."
            echo
            echo "Signing certificate SHA-256: \`$cert\`"
          } > notes.md
          gh release create "v$V" \
            --target "$GITHUB_SHA" \
            --title "ii tools $V" \
            --notes-file notes.md \
            "ii-tools-$V.apk" "ii-tools-$V-banner.png"
